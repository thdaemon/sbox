[package]
name = "sbox"
version = "0.1.1"
rust-version = "1.85"
edition = "2024"
description = "Unprivileged sandbox bootstrapper with persistent namespaces"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
nix = { version = "0.31", features = [
    "user",
    "mount",
    "sched",
    "signal",
    "process",
    "fs",
    "term",
    "poll",
    "socket",
    "hostname",
    "ioctl",
    "uio",
] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
